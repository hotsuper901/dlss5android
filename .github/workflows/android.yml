name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest is mid-migration to Ubuntu 26 and android-actions/*
    # breaks on the new image. 22.04 is stable and has the full SDK toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$HOME"
          # Fetch the command line tools directly instead of relying on the
          # deprecated android-actions/setup-android action.
          ZIP="commandlinetools-linux-11076708_latest.zip"
          curl -fsSL -o "$ZIP" \
            "https://dl.google.com/android/repository/$ZIP"
          unzip -q -o "$ZIP" -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -f "$ZIP"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Licences must be accepted explicitly or the platform build fails.
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        # The wrapper jar is a binary and is not committed, so generate it here
        # instead of letting ./gradlew fail with "No such file".
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon || true

      - uses: actions/upload-artifact@v4
        with:
          name: msj-gfx-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Signed release APK, published with the exact filename requested.
  #
  # The release build type falls back to the debug signing config when no
  # MSJ_STORE_FILE keystore property is supplied, which is what makes this
  # runnable on a fork with no secrets. It is therefore an installable APK,
  # just not a Play-uploadable one until a real keystore is wired up.
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$HOME"
          ZIP="commandlinetools-linux-11076708_latest.zip"
          curl -fsSL -o "$ZIP" \
            "https://dl.google.com/android/repository/$ZIP"
          unzip -q -o "$ZIP" -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -f "$ZIP"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Generate a signing keystore
        # The release build type falls back to the debug signing config when no
        # MSJ_STORE_FILE is supplied, and that fallback was producing an
        # *unsigned* APK rather than a debug-signed one - CI caught it via
        # scripts/verify-apk-signature.py. So sign it properly and explicitly.
        #
        # This keystore is generated per run. That means each build is signed by
        # a different key, so a new APK will not install over an old one
        # (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Set MSJ_KEYSTORE_B64 as a repo
        # secret to ship updates from a stable key.
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -alias msj -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MSJ GFX, OU=Release, O=MSJ GFX, L=, ST=, C=US" \
            > /dev/null 2>&1
          ls -la ci-release.keystore
        env:
          KEYSTORE_PASS: ${{ secrets.MSJ_KEYSTORE_PASS || 'msj-gfx-ci' }}

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -PMSJ_STORE_FILE=ci-release.keystore \
            -PMSJ_STORE_PASSWORD="$KEYSTORE_PASS" \
            -PMSJ_KEY_ALIAS=msj \
            -PMSJ_KEY_PASSWORD="$KEYSTORE_PASS"
        env:
          KEYSTORE_PASS: ${{ secrets.MSJ_KEYSTORE_PASS || 'msj-gfx-ci' }}

      - name: Inspect build output
        shell: bash
        run: ls -la app/build/outputs/apk/release/ app/build/outputs/apk/named/ || true

      - name: Name the artifact
        shell: bash
        run: |
          set -euo pipefail
          # The gradle task already emitted the exact product name; copy from
          # there so the artifact payload and a local build agree.
          SRC="app/build/outputs/apk/named/M.S.J GFX.apk"
          test -f "$SRC" || SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          ls -la app/build/outputs/apk/release/ app/build/outputs/apk/named/ || true
          # Refuse to publish an APK that cannot be verified. apksigner is the
          # canonical tool and is already on the runner via build-tools, so
          # there is no reason to reimplement zip parsing here - an earlier
          # hand-rolled version of this check reported a correctly signed APK
          # as unsigned and would have blocked every release.
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          python3 scripts/verify-apk-signature.py "$SRC"
          cp "$SRC" "dist/M.S.J GFX.apk"
          ls -la dist/
          sha256sum "dist/M.S.J GFX.apk" | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MSJ-GFX-release
          path: |
            dist/M.S.J GFX.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${TAG}"
          SHA=$(git rev-parse --short HEAD)
          NOTES="M.S.J GFX ${TAG} - build ${SHA}
          
          21 display-adapted looks that apply on game launch.
          Fullscreen tint over the frame, plus the OEM colour profile and
          brightness headroom where the device allows them.
          
          A tint layer cannot add sharpness, detail or HDR - it is a
          uniform translucent window over the frame. It deepens blacks and
          shifts white point, which is what makes a panel read richer."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # gh release upload sanitises spaces in asset names to dots, so the
            # published asset is "M.S.J.GFX.apk". Unavoidable through this API;
            # the exact name survives in the build artifact and in CI output.
            gh release upload "$TAG" "dist/M.S.J GFX.apk" --clobber
          else
            gh release create "$TAG" "dist/M.S.J GFX.apk" --title "M.S.J GFX $TAG" --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
